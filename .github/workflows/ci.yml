name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key
      JWT_SECRET_KEY: ci-only-jwt-secret-key
      DATABASE_URL: sqlite:////tmp/ci-expapp.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt bandit pip-audit
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
      - name: Migrations
        run: flask --app server db upgrade
      - name: Bandit
        run: bandit -q -r app server.py config.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nuxt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/nuxt/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
